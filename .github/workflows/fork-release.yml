name: Fork release

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      release_tag:
        description: Numeric version (the existing Git tag for a final release)
        required: true
        default: '0.41.0'
        type: string
      candidate:
        description: Publish the current open PR head as an isolated candidate
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: fork-release-${{ inputs.candidate && github.run_id || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'WU-CVGL/determined'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      REGISTRY: ghcr.io
      BASE_IMAGE: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate && github.sha || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR candidate or final tag and GitHub release
        env:
          REQUESTED_VERSION: ${{ inputs.release_tag }}
          IS_CANDIDATE: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=${REQUESTED_VERSION}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a numeric version' >&2; exit 1; }
          [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]] || exit 1
          source_sha=$(git rev-parse HEAD)
          if [[ "$IS_CANDIDATE" == true ]]; then
            [[ "$GITHUB_REF_TYPE" == branch && "$source_sha" == "$GITHUB_SHA" ]] || { echo 'Candidate must check out the selected branch HEAD' >&2; exit 1; }
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" -f state=open -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" >"${RUNNER_TEMP}/open-prs.json"
            jq -e --arg sha "$source_sha" --arg repo "$GITHUB_REPOSITORY" 'any(.[]; .head.sha == $sha and .head.repo.full_name == $repo)' "${RUNNER_TEMP}/open-prs.json" >/dev/null || {
              echo 'Candidate source is not the current head of an open PR from this repository' >&2
              exit 1
            }
            tag="${version}-rc.${GITHUB_RUN_ID}"
          else
            tag=$version
            git fetch --no-tags origin main:refs/remotes/origin/main
            [[ "$source_sha" == "$(git rev-parse "refs/tags/${tag}^{commit}")" ]] || { echo 'Checkout does not match release tag' >&2; exit 1; }
            git merge-base --is-ancestor "$source_sha" origin/main || { echo 'Release tag is not on main' >&2; exit 1; }
          fi
          for tool in gh jq docker; do command -v "$tool" >/dev/null || { echo "Missing hosted-runner tool: $tool" >&2; exit 1; }; done
          docker info >/dev/null

          # A published final release is immutable. Candidate retries must use the same source.
          release_error=$(mktemp)
          if gh release view "$tag" --json isDraft,assets >"${RUNNER_TEMP}/fork-release-state.json" 2>"$release_error"; then
            jq -e --arg version "$version" '(.assets | length) <= 1 and all(.assets[]; .name | startswith("determined-" + $version + "-") and endswith(".whl"))' "${RUNNER_TEMP}/fork-release-state.json" >/dev/null || {
              echo 'Existing release has unexpected assets' >&2
              exit 1
            }
            if [[ "$IS_CANDIDATE" != true ]] && ! jq -e '.isDraft == true' "${RUNNER_TEMP}/fork-release-state.json" >/dev/null; then
              echo 'Final release is already published' >&2
              exit 1
            fi
            if [[ "$IS_CANDIDATE" == true ]] && jq -e '.isDraft == false' "${RUNNER_TEMP}/fork-release-state.json" >/dev/null; then
              jq -e '(.assets | length) == 1' "${RUNNER_TEMP}/fork-release-state.json" >/dev/null || { echo 'Published candidate is missing its SDK wheel' >&2; exit 1; }
            fi
            git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            [[ "$source_sha" == "$(git rev-parse "refs/tags/${tag}^{commit}")" ]] || { echo 'Existing candidate tag points to another commit' >&2; exit 1; }
            echo 'EXISTING_DRAFT=true' >>"$GITHUB_ENV"
            if jq -e '.isDraft == false' "${RUNNER_TEMP}/fork-release-state.json" >/dev/null; then
              echo 'ALREADY_PUBLISHED=true' >>"$GITHUB_ENV"
            fi
          elif grep -Eqi 'release not found|HTTP 404' "$release_error"; then
            echo 'EXISTING_DRAFT=false' >>"$GITHUB_ENV"
            if [[ "$IS_CANDIDATE" == true ]] && git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null; then
              git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
              [[ "$source_sha" == "$(git rev-parse "refs/tags/${tag}^{commit}")" ]] || { echo 'Existing candidate tag points to another commit' >&2; exit 1; }
            fi
          else
            cat "$release_error" >&2
            exit 1
          fi
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY##*/}
          image_namespace="ghcr.io/${owner,,}"
          {
            echo "RELEASE_TAG=$tag"
            echo "VERSION=$version"
            echo "FORK_VERSION=$version"
            echo "IS_CANDIDATE=$IS_CANDIDATE"
            echo "SOURCE_SHA=$source_sha"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$source_sha")"
            echo "MASTER_IMAGE=${image_namespace}/${repo,,}-master:${tag}"
            echo "AGENT_IMAGE=${image_namespace}/${repo,,}-agent:${tag}"
          } >>"$GITHUB_ENV"

      - name: Check GHCR login and image tags
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config=$(mktemp -d "${RUNNER_TEMP}/docker-release-XXXXXXXX")
          echo "DOCKER_CONFIG=$config" >>"$GITHUB_ENV"
          echo "RELEASE_DOCKER_CONFIG=$config" >>"$GITHUB_ENV"
          export DOCKER_CONFIG="$config"
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          for role in master agent; do
            if [[ "$role" == master ]]; then image=$MASTER_IMAGE; else image=$AGENT_IMAGE; fi
            pull_error=$(mktemp)
            if docker pull --quiet "$image" >/dev/null 2>"$pull_error"; then
              revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
              if [[ "$revision" == "$SOURCE_SHA" ]]; then
                push=false
              else
                echo "Refusing to overwrite existing $role tag from revision $revision" >&2
                exit 1
              fi
            elif grep -Eqi 'manifest unknown|not found|no such manifest' "$pull_error"; then
              push=true
            else
              cat "$pull_error" >&2
              exit 1
            fi
            echo "PUSH_${role^^}=$push" >>"$GITHUB_ENV"
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: webui/react/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            harness/pyproject.toml
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.2
      - uses: arduino/setup-protoc@v3
        with:
          version: '25.3'
          repo-token: ${{ github.token }}

      - name: Build SDK wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel harness
          python -m pip install harness/dist/*.whl
          python - <<'PY'
          import pathlib, zipfile
          wheels = list(pathlib.Path('harness/dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = next(n for n in wheel.namelist() if n.endswith('.dist-info/METADATA'))
              assert f'Version: {__import__("os").environ["VERSION"]}' in wheel.read(metadata).decode().splitlines()
          PY

      - name: Build WebUI
        working-directory: webui/react
        env:
          PUBLIC_URL: /det
        run: |
          npm ci --no-audit
          npm run build

      - name: Build documentation and generated inputs
        run: |
          python -m pip install --no-cache-dir torch==2.3.0+cpu torchvision==0.18.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r docs/requirements.txt
          make -C proto get-deps
          make -C proto build
          make -C examples build
          make -C helm build
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/conf.py')
          source = path.read_text()
          remote = 'https://docs.determined.ai/latest/_static/version-switcher/versions.json'
          local = '_static/version-switcher/versions.json'
          if source.count(remote) != 1:
              raise SystemExit('expected one documentation version-switcher URL')
          path.write_text(source.replace(remote, local))
          PY
          make -C docs build SPHINXOPTS='-W --keep-going'

      - name: Build Linux binaries
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
          GOOS: linux
        run: |
          mkdir -p .fork-build/bin
          go build -trimpath -ldflags "-X github.com/determined-ai/determined/master/version.Version=${VERSION}" -o .fork-build/bin/determined-master ./master/cmd/determined-master
          go build -trimpath -ldflags "-X main.version=${VERSION}" -o .fork-build/bin/determined-agent ./agent/cmd/determined-agent
          go build -trimpath -o .fork-build/bin/determined-gotmpl ./master/cmd/determined-gotmpl

      - name: Build official images with a minimal context
        run: |
          set -euo pipefail
          mkdir -p .fork-build/master/{swagger,webui/docs,webui/react,wheels}
          cp -a proto/build/swagger/. .fork-build/master/swagger/
          cp -a docs/site/html/. .fork-build/master/webui/docs/
          cp -a webui/react/build/. .fork-build/master/webui/react/
          cp harness/dist/*.whl .fork-build/master/wheels/
          context=$(mktemp -d "${RUNNER_TEMP}/fork-context-XXXXXXXX")
          mkdir -p "$context/master/packaging" "$context/agent" "$context/tools/fork"
          cp LICENSE "$context/"
          cp master/packaging/master.yaml "$context/master/packaging/"
          cp -a master/static "$context/master/"
          cp -a agent/packaging "$context/agent/"
          cp -a .fork-build "$context/"
          cp tools/fork/Dockerfile.master tools/fork/Dockerfile.agent "$context/tools/fork/"
          docker build --build-arg "BASE_IMAGE=${BASE_IMAGE}" --build-arg "FORK_COMMIT=${SOURCE_SHA}" --build-arg "FORK_VERSION=${VERSION}" --build-arg "SOURCE_REPOSITORY=https://github.com/${GITHUB_REPOSITORY}" -f "$context/tools/fork/Dockerfile.master" -t "$MASTER_IMAGE" "$context"
          docker build --build-arg "BASE_IMAGE=${BASE_IMAGE}" --build-arg "FORK_COMMIT=${SOURCE_SHA}" --build-arg "FORK_VERSION=${VERSION}" --build-arg "SOURCE_REPOSITORY=https://github.com/${GITHUB_REPOSITORY}" -f "$context/tools/fork/Dockerfile.agent" -t "$AGENT_IMAGE" "$context"
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$MASTER_IMAGE") == "$SOURCE_SHA" ]]
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$AGENT_IMAGE") == "$SOURCE_SHA" ]]

      - name: Push GHCR images
        run: |
          set -euo pipefail
          if [[ "$PUSH_MASTER" == true ]]; then docker push "$MASTER_IMAGE"; fi
          if [[ "$PUSH_AGENT" == true ]]; then docker push "$AGENT_IMAGE"; fi
          for image in "$MASTER_IMAGE" "$AGENT_IMAGE"; do
            docker pull --quiet "$image" >/dev/null
            [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image") == "$SOURCE_SHA" ]] || {
              echo "Remote image revision mismatch: $image" >&2
              exit 1
            }
          done

      - name: Publish GitHub release with SDK wheel
        if: env.ALREADY_PUBLISHED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/fork-release-notes.md"
          python - "$notes" <<'PY'
          import os
          import pathlib
          import sys

          source = pathlib.Path('docs/release-notes.rst').read_text().splitlines()
          title = f'Version {os.environ["VERSION"]}'
          start = next(i for i, line in enumerate(source)
                       if line.strip() in (title, f'{title} (research-cluster fork)')) + 1
          # Patch versions share a major/minor section; stop at the next version heading.
          end = next((i for i in range(start, len(source))
                      if source[i].strip().startswith('Version ')), len(source))
          sections = []
          heading = None
          for line in source[start:end]:
              stripped = line.strip()
              if stripped.startswith('**') and stripped.endswith('**'):
                  heading = stripped.strip('*')
                  continue
              if line.startswith('-  ') and heading:
                  sections.append([heading, line[3:].strip()])
              elif line.startswith('   ') and sections:
                  sections[-1][1] += ' ' + stripped
          if not sections:
              raise SystemExit('No release-note bullets found for this tag')
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          output = [
              f'Research-cluster fork {"PR candidate" if os.environ["IS_CANDIDATE"] == "true" else "release"} {os.environ["RELEASE_TAG"]} from [source commit {sha[:12]}](https://github.com/{repo}/commit/{sha}).',
              '',
          ]
          previous = None
          for section, bullet in sections:
              if section != previous:
                  output += [f'### {section}', '']
                  previous = section
              output += [f'- {bullet.replace("``", "`")}', '']
          output += [
              f'[Full release notes](https://github.com/{repo}/blob/{sha}/docs/release-notes.rst)',
              '',
              f'GHCR images: `{os.environ["MASTER_IMAGE"]}` and `{os.environ["AGENT_IMAGE"]}`.',
          ]
          pathlib.Path(sys.argv[1]).write_text('\n'.join(output) + '\n')
          PY
          if [[ "$EXISTING_DRAFT" == true ]]; then
            if [[ "$IS_CANDIDATE" == true ]]; then title="Determined $RELEASE_TAG (PR candidate)"; else title="Determined $VERSION"; fi
            gh release edit "$RELEASE_TAG" --target "$SOURCE_SHA" --title "$title" --notes-file "$notes" --prerelease="$IS_CANDIDATE" --verify-tag
          else
            if [[ "$IS_CANDIDATE" == true ]]; then
              gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "Determined $RELEASE_TAG (PR candidate)" --notes-file "$notes" --prerelease --draft
            else
              gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "Determined $VERSION" --notes-file "$notes" --prerelease=false --draft --verify-tag
            fi
          fi
          gh release upload "$RELEASE_TAG" harness/dist/*.whl --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$IS_CANDIDATE"
          if [[ "$IS_CANDIDATE" != true ]]; then gh release edit "$RELEASE_TAG" --latest; fi
          downloaded=$(mktemp -d "${RUNNER_TEMP}/release-download-XXXXXXXX")
          gh release download "$RELEASE_TAG" --pattern '*.whl' --dir "$downloaded"
          for wheel in harness/dist/*.whl; do cmp "$wheel" "$downloaded/$(basename "$wheel")"; done

      - name: Remove temporary GHCR login
        if: always()
        run: |
          if [[ -n "${RELEASE_DOCKER_CONFIG:-}" ]]; then
            docker logout "$REGISTRY" >/dev/null 2>&1 || true
            rm -rf "$RELEASE_DOCKER_CONFIG"
          fi
