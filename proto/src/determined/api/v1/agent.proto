syntax = "proto3";

package determined.api.v1;
option go_package = "github.com/determined-ai/determined/proto/pkg/apiv1";

import "google/protobuf/timestamp.proto";
import "determined/api/v1/pagination.proto";
import "protoc-gen-swagger/options/annotations.proto";

import "determined/agent/v1/agent.proto";

// Get a set of agents from the cluster.
message GetAgentsRequest {
  // Sorts agents by the given field.
  enum SortBy {
    // Returns agents in an unsorted list.
    SORT_BY_UNSPECIFIED = 0;
    // Returns agents sorted by id.
    SORT_BY_ID = 1;
    // Returns agents sorted by time.
    SORT_BY_TIME = 2;
  }
  reserved 5;
  reserved "label";
  // Sort agents by the given field.
  SortBy sort_by = 1;
  // Order agents in either ascending or descending order.
  OrderBy order_by = 2;
  // Skip the number of agents before returning results. Negative values
  // denote number of agents to skip from the end before returning results.
  int32 offset = 3;
  // Limit the number of agents. A value of 0 denotes no limit.
  int32 limit = 4;
  // exclude slots
  bool exclude_slots = 6;
  // exclude containers
  bool exclude_containers = 7;
  // Read each GPU's memory from the cluster's DCGM-Exporter in the Prometheus
  // of integrations.task_resources into gpu_topology.gpus[].memory. It needs
  // the permission to view agent details, and it cannot be combined with
  // exclude_slots. A failed query fails the request.
  bool include_gpu_memory = 8;
  // Read each GPU's power draw and limits into gpu_topology.gpus[].power, from
  // the same source and under the same conditions as include_gpu_memory. With
  // both, the master sends one query.
  bool include_gpu_power = 9;
}
// Response to GetAgentsRequest.
message GetAgentsResponse {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: { required: [ "agents" ] }
  };

  // The list of returned agents.
  repeated determined.agent.v1.Agent agents = 1;
  // Pagination information of the full dataset.
  Pagination pagination = 2;
  // When the master read the GPU memory, by the master's clock. It is set
  // only when include_gpu_memory was requested and the read succeeded; with no
  // GPUs, nothing is queried and it is the time of the request.
  google.protobuf.Timestamp gpu_memory_queried_at = 3;
  // When the master read the GPU power, as gpu_memory_queried_at for
  // include_gpu_power.
  google.protobuf.Timestamp gpu_power_queried_at = 4;
}

// Get the requested agent.
message GetAgentRequest {
  // The id of the agent.
  string agent_id = 1;
}
// Response to GetAgentRequest.
message GetAgentResponse {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: { required: [ "agent" ] }
  };
  // The requested agent.
  determined.agent.v1.Agent agent = 1;
}

// Get the set of slots for the agent with the given id.
message GetSlotsRequest {
  // The id of the agent.
  string agent_id = 1;
}
// Response to GetSlotsRequest.
message GetSlotsResponse {
  // The requested slots.
  repeated determined.agent.v1.Slot slots = 1;
}

// Get the requested slot for the agent with the given id.
message GetSlotRequest {
  // The id of the agent.
  string agent_id = 1;
  // The id of the slot.
  string slot_id = 2;
}
// Response to GetSlotRequest.
message GetSlotResponse {
  // The requested slot.
  determined.agent.v1.Slot slot = 1;
}

// Enable the agent.
message EnableAgentRequest {
  // The id of the agent.
  string agent_id = 1;
}
// Response to EnableAgentRequest.
message EnableAgentResponse {
  // The enabled agent.
  determined.agent.v1.Agent agent = 1;
}

// Disable the agent.
message DisableAgentRequest {
  // The id of the agent.
  string agent_id = 1;
  // If true, wait for running tasks to finish.
  bool drain = 2;
}
// Response to DisableAgentRequest.
message DisableAgentResponse {
  // The disabled agent.
  determined.agent.v1.Agent agent = 1;
}

// Enable the slot.
message EnableSlotRequest {
  // The id of the agent.
  string agent_id = 1;
  // The id of the slot.
  string slot_id = 2;
}
// Response to EnableSlotRequest.
message EnableSlotResponse {
  // The enabled slot.
  determined.agent.v1.Slot slot = 1;
}

// Disable the slot.
message DisableSlotRequest {
  // The id of the agent.
  string agent_id = 1;
  // The id of the slot.
  string slot_id = 2;
  // If true, wait for running task to finish.
  bool drain = 3;
}
// Response to DisableSlotRequest.
message DisableSlotResponse {
  // The disabled slot.
  determined.agent.v1.Slot slot = 1;
}
