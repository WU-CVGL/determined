syntax = "proto3";

package determined.job.v1;
option go_package = "github.com/determined-ai/determined/proto/pkg/jobv1";

import "google/protobuf/timestamp.proto";
import "protoc-gen-swagger/options/annotations.proto";

// Job type.
enum Type {
  // Unspecified state.
  TYPE_UNSPECIFIED = 0;
  // Experiement Job.
  TYPE_EXPERIMENT = 1;
  reserved 2;
  reserved "TYPE_NOTEBOOK";
  // TensorBoard Job.
  TYPE_TENSORBOARD = 3;
  // Shell Job.
  TYPE_SHELL = 4;
  // Command Job.
  TYPE_COMMAND = 5;
  // CheckpointGC Job.
  TYPE_CHECKPOINT_GC = 6;
  // External Job.
  TYPE_EXTERNAL = 7;
  // Generic Job.
  TYPE_GENERIC = 8;
}

// Job state.
enum State {
  // Unspecified state.
  STATE_UNSPECIFIED = 0;
  // Job is queued and waiting to be schedlued.
  STATE_QUEUED = 1;
  // Job is scheduled.
  STATE_SCHEDULED = 2;
  // Job is scheduled as a backfill.
  STATE_SCHEDULED_BACKFILLED = 3;
}

// Job summary.
message JobSummary {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: { required: [ "state", "jobs_ahead" ] }
  };
  // The scheduling state of the job.
  State state = 1;
  // The number of jobs ahead of this one in the queue.
  int32 jobs_ahead = 2;
}

// LimitedJob is a Job with omitted fields.
message LimitedJob {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "type",
        "resource_pool",
        "is_preemptible",
        "requested_slots",
        "allocated_slots",
        "workspace_id",
        "job_id"
      ]
    }
  };
  // Job summary.
  JobSummary summary = 1;
  // Job type.
  Type type = 2;
  // Associated resource pool.
  string resource_pool = 5;
  // Whether the job is preemptible.
  bool is_preemptible = 6;
  // The job priority in priority scheduler.
  int32 priority = 7;
  // The job weight in fairshare scheduler.
  double weight = 8;
  // Job type.
  string job_id = 10;
  // Number of requested slots.
  int32 requested_slots = 11;
  // Number of allocated slots.
  int32 allocated_slots = 12;
  // Job's progress from 0 to 1.
  float progress = 14;
  // Job's workspace id.
  int32 workspace_id = 16;
}

// The slots a job holds on one agent.
message JobPlacement {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: { required: [ "agent_id", "device_ids" ] }
  };
  // The agent ID.
  string agent_id = 1;
  // The slots' device IDs, ascending. For an NVIDIA GPU, the index nvidia-smi
  // shows on the agent's node.
  repeated int32 device_ids = 2;
}

// Job represents a user submitted work that is not in a terminal
// state.
message Job {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "type",
        "submission_time",
        "username",
        "resource_pool",
        "is_preemptible",
        "entity_id",
        "name",
        "workspace_id",
        "requested_slots",
        "allocated_slots",
        "job_id"
      ]
    }
  };
  // Job summary.
  JobSummary summary = 1;
  // Job type.
  Type type = 2;
  // The time when the job was submitted by the user.
  google.protobuf.Timestamp submission_time = 3;
  // The username of the user who submitted the job.
  string username = 4;
  // The id of the user who submitted the job.
  int32 user_id = 15;
  // Associated resource pool.
  string resource_pool = 5;
  // Whether the job is preemptible.
  bool is_preemptible = 6;
  // The job priority in priority scheduler.
  int32 priority = 7;
  // The job weight in fairshare scheduler.
  double weight = 8;
  // Entity ID.
  string entity_id = 9;
  // Job type.
  string job_id = 10;
  // Number of requested slots.
  int32 requested_slots = 11;
  // Number of allocated slots.
  int32 allocated_slots = 12;
  // Job name.
  string name = 13;
  // Job's progress from 0 to 1.
  float progress = 14;
  // Job's workspace id.
  int32 workspace_id = 16;
  // The slots the job holds, one entry per agent where it holds any, by agent
  // ID. Agent resource manager only.
  repeated JobPlacement placement = 17;
  // First resource assignment across the job's allocations, supplied by the job
  // queue list APIs. Unset if no allocation has received resources.
  // Available only in Agent-only clusters; omitted on other or mixed backends.
  google.protobuf.Timestamp allocation_start_time = 18;
  // What the requesting user may do with this job's content.
  JobCapabilities capabilities = 19;
}

// RBACJob is a job that can have either a limited or a full
// representation of a job.
message RBACJob {
  // job represent one of the possible representations of a job.
  oneof job {
    // Full representation.
    Job full = 1;
    // Limited representation for lower access levels.
    LimitedJob limited = 2;
  }
}

// Describes a message to control jobs in a queue.
message QueueControl {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: { required: [ "job_id", "action" ] }
  };
  // Job id.
  string job_id = 1;
  // The action to perform.
  oneof action {
    // Deprecated; do not use.
    string ahead_of = 2 [deprecated = true];
    // Deprecated; do not use.
    string behind_of = 4 [deprecated = true];
    // Name of the target resource_pool to move the job to.
    string resource_pool = 3;
    // The desired job priority in priority scheduler.
    int32 priority = 5;
    // The desired job weight in fairshare scheduler.
    float weight = 6;
  }
}

// Statistics for a queue.
message QueueStats {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: { required: [ "queued_count", "scheduled_count" ] }
  };
  // Number of queued jobs in the queue.
  int32 queued_count = 1;
  // Number of scheduled jobs in the queue.
  int32 scheduled_count = 2;
}

// Aggregate statistics for a queue.
message AggregateQueueStats {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: { required: [ "period_start", "seconds" ] }
  };
  // The date of this entry.
  string period_start = 1;
  // The total number of seconds queued.
  float seconds = 2;
}

// The content kinds of job privacy.
enum JobContentKind {
  // Unspecified kind.
  JOB_CONTENT_KIND_UNSPECIFIED = 0;
  // The job's name, description, labels and notes.
  JOB_CONTENT_KIND_TITLE = 1;
  // The job's logs.
  JOB_CONTENT_KIND_LOGS = 2;
  // The job's config.
  JOB_CONTENT_KIND_CONFIG = 3;
}

// Who may read a kind of a job's content besides its owner and admins. Empty
// means nobody else.
message JobAudience {
  // All authenticated users.
  bool all_users = 1;
}

// What the requesting user may do with this job's content, computed by the
// server.
message JobCapabilities {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: {
      required: [ "view_title", "view_logs", "view_config", "manage_sharing" ]
    }
  };
  // The user may read the job's name, description, labels and notes.
  bool view_title = 1;
  // The user may read the job's logs.
  bool view_logs = 2;
  // The user may read the job's config.
  bool view_config = 3;
  // The user may change the job's sharing.
  bool manage_sharing = 4;
}

// A job's own sharing. An unset audience is a job created before job privacy:
// no setting.
message JobSharing {
  // Who may read the job's title.
  JobAudience title = 1;
  // Who may read the job's logs.
  JobAudience logs = 2;
  // Who may read the job's config.
  JobAudience config = 3;
  // The user who last changed the job's sharing.
  optional int32 updated_by = 4;
  // When the job's sharing was last changed.
  google.protobuf.Timestamp updated_at = 5;
}

// The cluster policy for one kind of job content.
message JobPrivacyRule {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: { required: [ "kind", "sharing_allowed", "new_job_audience" ] }
  };
  // The content kind.
  JobContentKind kind = 1;
  // Whether jobs may share this kind with users other than the owner.
  bool sharing_allowed = 2;
  // The audience new jobs get unless the owner chose one.
  JobAudience new_job_audience = 3;
}

// A user's job privacy preferences.
message UserJobPrivacy {
  option (grpc.gateway.protoc_gen_swagger.options.openapiv2_schema) = {
    json_schema: { required: [ "share_titles", "share_logs" ] }
  };
  // Whether the titles of the user's jobs are shared.
  bool share_titles = 1;
  // Whether the logs of the user's jobs are shared.
  bool share_logs = 2;
  // The title audience of the user's new jobs. Unset: the cluster default.
  JobAudience new_job_titles = 3;
  // The logs audience of the user's new jobs. Unset: the cluster default.
  JobAudience new_job_logs = 4;
}
